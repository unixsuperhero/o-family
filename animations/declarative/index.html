<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Declared Once</title>
<style>
:root{
  --backdrop:#050607;
  --bg:#0e1013;
  --panel:#14171c;
  --panel-bar:#1a1e24;
  --rule:#2a3038;
  --paper:#ece6da;
  --soft:#a9a49a;
  --faint:#6d6a64;
  --you:#f2a07b;
  --model:#9fe0b4;
  --gold:#f0c674;
  --c-com:#6f7a72;
  --c-str:#e6c07b;
  --c-kw:#d79ccf;
  --c-fn:#8cc8f0;
  --c-key:#9fe0b4;
  --c-op:#f2a07b;
  --c-num:#f0c674;
  --mono:"SF Mono","SFMono-Regular",Menlo,Consolas,monospace;
  --serif:"New York","Iowan Old Style",Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Avenir Next","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--backdrop);overflow:hidden}
body{display:grid;place-items:center}
.stage{width:1920px;height:1080px;position:relative;overflow:hidden;flex-shrink:0;background:var(--bg);color:var(--paper);font-family:var(--sans);transform-origin:center}
.stage::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 70% 60% at 100% 0%,#1d2a2333,transparent 70%),radial-gradient(ellipse 60% 50% at 0% 100%,#2a1f1a33,transparent 70%)}

/* chrome */
.top{position:absolute;left:96px;right:96px;top:64px;height:64px;display:flex;align-items:flex-end;justify-content:space-between;gap:40px}
.top .ch{display:flex;align-items:baseline;gap:22px;min-width:0}
.top .num{font:500 20px var(--mono);color:var(--model);letter-spacing:2px}
.top .title{font:400 40px/1.1 var(--serif);letter-spacing:-.5px;white-space:nowrap}
.top .src{font:15px var(--mono);color:var(--faint);white-space:nowrap}
.rule{position:absolute;left:96px;right:96px;top:150px;height:1px;background:var(--rule)}
.progress{position:absolute;left:96px;right:96px;bottom:56px;display:flex;gap:8px}
.progress i{flex:1;height:3px;background:var(--rule);border-radius:2px;overflow:hidden;position:relative}
.progress i b{position:absolute;inset:0;background:var(--model);transform-origin:left;transform:scaleX(0)}
.progress i.done b{transform:scaleX(1)}
.brand{position:absolute;right:96px;bottom:22px;font:13px var(--mono);color:var(--faint);letter-spacing:3px;text-transform:uppercase}

/* beats: each one is a layer filling the content area */
.content{position:absolute;left:96px;right:96px;top:166px;bottom:96px}
.layer{position:absolute;inset:0;opacity:0}

/* thread */
.thread-layer{display:grid;grid-template-columns:860px minmax(0,1fr);gap:72px}
.viewport{position:relative;overflow:hidden;min-height:0;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 34px);mask-image:linear-gradient(to bottom,transparent 0,#000 34px)}
.thread{position:absolute;left:0;right:0;top:0;padding-top:24px}
.msg{margin-bottom:34px;opacity:0}
.who{font:600 15px var(--mono);letter-spacing:3px;text-transform:uppercase;margin-bottom:12px}
.msg.you .who{color:var(--you)}
.msg.model .who{color:var(--model)}
.msg.you .text{font-size:27px;line-height:1.45;color:#d6d0c4;border-left:3px solid #f2a07b55;padding-left:22px}
.msg.you .c{opacity:0}
.msg.model .text{font-family:var(--serif);font-size:32px;line-height:1.36;letter-spacing:-.3px;color:#bdb7ab}
.text p{margin:0 0 .55em}
.text p:last-child{margin-bottom:0}
.code-inline{font-family:var(--mono);font-size:.78em;color:var(--soft);display:inline-block;margin-top:.4em}
/* {{icon:NAME}} in any text: an inline square mark, 1.1em of the text around it */
.ico{display:inline-block;width:1.1em;height:1.1em;vertical-align:-.2em;flex-shrink:0}
.ico svg{width:100%;height:100%;display:block}
.ico.none{border-radius:.24em;background:var(--rule)}
.overlay .head .ico{width:.78em;height:.78em;vertical-align:-.04em}
.w{opacity:0;display:inline-block;white-space:pre}
.m{background-image:linear-gradient(var(--model),var(--model));background-repeat:no-repeat;background-position:0 92%;background-size:0% 3px;padding-bottom:2px}
.msg.you .m{background-image:linear-gradient(var(--you),var(--you))}
.m .w{display:inline}

.right{min-height:0;min-width:0;display:flex;flex-direction:column;gap:22px}
.slot{display:grid;min-height:0;flex:0 1 auto;max-height:100%}
.right.two .slot{flex:1 1 0}
.slot>*{grid-area:1/1;align-self:start;max-height:100%;min-height:0}

/* code panel */
.panel{background:var(--panel);border:1px solid var(--rule);border-radius:14px;overflow:hidden;box-shadow:0 30px 80px #0006;opacity:0;display:flex;flex-direction:column}
.bar{height:46px;flex-shrink:0;display:flex;align-items:center;gap:16px;padding:0 20px;background:var(--panel-bar);border-bottom:1px solid var(--rule);font:15px var(--mono);color:var(--soft)}
.dots{display:flex;gap:8px}.dots i{width:11px;height:11px;border-radius:50%;background:#3a4048}
.dots i:nth-child(1){background:#e0795f}.dots i:nth-child(2){background:#d8b45a}.dots i:nth-child(3){background:#6fbf84}
.bar .label{position:relative;flex:1;height:20px}
.bar .label span{position:absolute;left:0;top:0;white-space:nowrap}
.body{position:relative;padding:20px 0 24px;overflow:hidden;flex:1;min-height:0}
.stack{display:grid}
.stack>.block{grid-area:1/1}
.block{font-family:var(--mono);line-height:1.6;white-space:pre}
.ln{display:block;position:relative;padding:0 26px 0 60px;opacity:0;border-radius:3px}
.ln::before{content:attr(data-n);position:absolute;left:0;width:42px;text-align:right;color:#454b54;font-size:.8em;top:.12em}
.ln .strike{position:absolute;left:54px;right:20px;top:52%;height:2px;background:var(--you);transform:scaleX(0);transform-origin:left}
.com{color:var(--c-com);font-style:italic}.str{color:var(--c-str)}.kw{color:var(--c-kw)}.fn{color:var(--c-fn)}.key{color:var(--c-key)}.op{color:var(--c-op)}.num{color:var(--c-num)}
.glow{border-radius:4px}

/* split */
.split-layer{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:start;align-content:center;padding-bottom:40px}
.split-layer .panel{max-height:798px}

/* cards */
.cards{display:flex;flex-direction:column;gap:30px}
.card h4{margin:0 0 14px;font:600 15px var(--mono);letter-spacing:3px;text-transform:uppercase;opacity:0}
.card.good h4{color:var(--model)}.card.risk h4{color:var(--you)}
.card .item{font-size:26px;line-height:1.3;padding:13px 20px;margin-bottom:10px;background:var(--panel);border:1px solid var(--rule);border-left:4px solid var(--model);border-radius:8px;opacity:0}
.card.risk .item{border-left-color:var(--you)}
.card .item.hot{border-color:#9fe0b466;border-left-color:var(--model);background:#16201b}

/* quote */
.quote-layer{display:flex;flex-direction:column;justify-content:center;padding:0 64px 40px}
.quote-layer .who{color:var(--model);margin-bottom:34px}
.quote-layer .big{font:400 96px/1.12 var(--serif);letter-spacing:-2.5px;color:var(--paper);max-width:1560px}
.quote-layer .big .m{background-size:0% 6px;background-position:0 94%}
.quote-layer .lead{color:#bdb7ab}

/* readers */
.readers{position:absolute;left:0;right:0;top:0;height:610px}
.readers>svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.readers path{fill:none;stroke:#9fe0b4;stroke-width:2;stroke-dasharray:1;stroke-dashoffset:1;opacity:.6}
.dot{position:absolute;left:0;top:0;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:var(--model);box-shadow:0 0 14px var(--model);opacity:0;offset-rotate:0deg}
.src-card{position:absolute;left:0;width:540px;background:var(--panel);border:1px solid var(--model);border-radius:14px;box-shadow:0 0 60px #9fe0b41a;opacity:0;overflow:hidden}
.src-card .bar{color:var(--model)}
.src-card .code{padding:18px 22px;font:19px/1.6 var(--mono);white-space:pre}
.reader{position:absolute;left:780px;right:0;height:104px;background:var(--panel);border:1px solid var(--rule);border-radius:10px;opacity:0;overflow:hidden}
.reader .rbar{height:32px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:var(--panel-bar);border-bottom:1px solid var(--rule);font:13px var(--mono);color:var(--soft)}
.reader .rbar b{font-weight:500;color:var(--paper)}
.reader .rbar span{color:var(--model);letter-spacing:2px;text-transform:uppercase}
.reader .rbody{padding:9px 16px;font:18px/1.6 var(--mono);white-space:pre}
.faint{color:var(--faint)}
.chip{padding:1px 8px;border-radius:4px;background:#2a3038}
.caption{position:absolute;left:0;right:0;top:640px;font-family:var(--serif);font-size:34px;line-height:1.38;color:#bdb7ab;letter-spacing:-.3px}

/* ── this animation's own styles (beats it adds) ── */
/* clip: a real recording, synced to the segment clock */
.clip-layer{display:grid;grid-template-columns:1180px minmax(0,1fr);gap:56px;align-items:start}
.clip-box{position:relative;width:1180px;height:664px;border-radius:14px;overflow:hidden;border:1px solid var(--rule);background:#1e1e2e;box-shadow:0 30px 80px #0006;opacity:0}
.clip-box video{width:100%;height:100%;display:block;object-fit:contain}
.clip-left{display:flex;flex-direction:column;align-items:center}
.clip-left>.clip-box,.clip-left>.clip-cap{align-self:stretch}
.clip-tag{margin:0 0 12px;font:600 13px var(--mono);letter-spacing:2.5px;text-transform:uppercase;padding:4px 12px;border-radius:5px;color:#9fe0b4cc;border:1px solid #9fe0b433;background:transparent}
.clip-tag.empty{visibility:hidden}
.clip-tag.fast{color:var(--you);border-color:#f2a07b55}
.clip-tag i{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--you);margin-right:9px;vertical-align:1px}
.clip-cap{font:15px var(--mono);color:var(--faint);margin-top:14px;opacity:0}
.clip-side{min-width:0;height:818px;overflow:hidden;position:relative;-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 24px);mask-image:linear-gradient(to bottom,transparent 0,#000 24px)}
.clip-inner{position:relative;padding-top:4px}
.clip-side .kick{font:600 15px var(--mono);letter-spacing:3px;text-transform:uppercase;color:var(--model);margin-bottom:16px;opacity:0}
.clip-side .head{font:400 34px/1.25 var(--serif);letter-spacing:-.4px;color:var(--paper);margin-bottom:26px;opacity:0}
.cue{font:19px/1.4 var(--mono);color:var(--soft);padding:9px 14px;margin-bottom:8px;border-left:3px solid var(--rule);border-radius:4px;opacity:0}
.cue b{color:var(--gold);font-weight:500}
.cue.on{border-left-color:var(--model)}
.free{margin-top:24px;opacity:0}
.free .h{font:600 14px var(--mono);letter-spacing:3px;text-transform:uppercase;color:var(--faint);margin-bottom:10px}
.free .it{font:21px/1.35 var(--sans);color:#d6d0c4;padding:4px 0 4px 18px;position:relative}
.free .it::before{content:"";position:absolute;left:0;top:.62em;width:7px;height:7px;border-radius:50%;background:var(--model)}
.planned{color:var(--you);font:600 13px var(--mono);letter-spacing:2px;text-transform:uppercase;border:1px solid #f2a07b66;border-radius:4px;padding:1px 6px;margin-left:8px;vertical-align:2px}

/* keys grid: same keys, different apps */
.keys-head{font:400 44px/1.2 var(--serif);letter-spacing:-.6px;margin:10px 0 30px;opacity:0}
.keys-grid{display:grid;gap:8px 10px}
.kh{font:600 15px var(--mono);letter-spacing:3px;text-transform:uppercase;color:var(--model);padding:0 14px 6px}
.kk,.kc{font:20px var(--mono);padding:10px 14px;border-radius:8px;opacity:0}
.kk{color:var(--gold);background:#f0c6741a;border:1px solid #f0c67433}
.kc{color:#d6d0c4;background:var(--panel);border:1px solid var(--rule)}
.kc.none{color:var(--faint)}
.keys-foot{font:400 32px/1.36 var(--serif);color:#bdb7ab;margin-top:30px;opacity:0;max-width:1600px}
.keys-foot .m{background-size:0% 3px}

/* contrast: imperative vs declared, bands aligned row by row */
.ct-layer{display:grid;grid-template-columns:minmax(0,1fr) 72px minmax(0,1fr);grid-auto-rows:auto;column-gap:0;row-gap:0;align-content:start}
.ct-bar{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1fr) 72px minmax(0,1fr);margin-bottom:10px}
.ct-bar div{font:600 14px var(--mono);letter-spacing:2px;text-transform:uppercase;color:var(--soft);opacity:0}
.ct-bar div:first-child{color:var(--you)}.ct-bar div:last-child{color:var(--model)}
.ct-l{background:var(--panel);border-left:1px solid var(--rule);border-right:1px solid var(--rule);padding:10px 0;opacity:0;position:relative}
.ct-l.first{border-top:1px solid var(--rule);border-radius:12px 12px 0 0}
.ct-l.last{border-bottom:1px solid var(--rule);border-radius:0 0 12px 12px}
.ct-l.config{background:#15201a}
.ct-l::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--gold);opacity:.55}
.ct-l.config::before{background:var(--model)}
.ct-r{align-self:stretch;display:flex;flex-direction:column;padding:6px 0}
.ct-r .panel{flex:1;opacity:0;border-left:4px solid #f0c6748c}
.ct-r.config .panel{border-left-color:#9fe0b48c;background:#15201a}
.ct-r .bar{height:34px;font-size:13px}
.ct-r .body{padding:10px 0 12px}
.ct-mid{position:relative;opacity:0}
.ct-mid::before{content:"";position:absolute;left:10px;right:10px;top:50%;height:2px;background:var(--gold);opacity:.6}
.ct-mid.config::before{background:var(--model)}
.ct-mid span{position:absolute;left:0;right:0;top:calc(50% - 22px);text-align:center;font:600 11px var(--mono);letter-spacing:1px;color:var(--faint);text-transform:uppercase}
.ct-code .ln{padding:0 18px 0 22px}
.ct-code .ln::before{display:none}
.ct-cap{grid-column:1/-1;margin-top:14px;font:22px var(--mono);color:var(--gold);height:30px;position:relative}
.ct-cap div{position:absolute;left:0;top:0;opacity:0}

/* this animation lists more tools than the template expects: tighter card rows */
.card .item{padding:10px 20px;margin-bottom:9px}
/* ── end of this animation's own styles ── */

/* overlays */
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:0 160px;background:var(--bg);opacity:0;pointer-events:none}
.overlay .big{font:400 180px/1 var(--serif);color:var(--model);letter-spacing:-6px;margin-bottom:10px}
.overlay .head{font:400 88px/1.08 var(--serif);letter-spacing:-2px;max-width:1500px}
.overlay .sub{font:20px var(--mono);color:var(--faint);margin-top:34px;letter-spacing:1px}
.overlay .kicker{font:600 18px var(--mono);color:var(--model);letter-spacing:5px;text-transform:uppercase;margin-bottom:28px}
.lockup{align-self:center;display:flex;flex-direction:column;align-items:center;gap:80px}
.lk-mark{font:400 104px/1 var(--serif);letter-spacing:-2px;color:var(--paper);display:flex;align-items:center;gap:32px;white-space:nowrap}
.lk-mark .ico{width:1.15em;height:1.15em;vertical-align:0}
.lk-row{display:flex;gap:56px}
.lk-item{display:flex;flex-direction:column;align-items:center;gap:14px;font:500 15px var(--mono);letter-spacing:2px;color:var(--soft);opacity:0}
.lk-item .ico{width:72px;height:72px}
.lk-foot{margin-top:-24px;font:400 20px var(--mono);letter-spacing:1px;color:var(--faint);opacity:0}
.lk-foot a{color:inherit;text-decoration:none;pointer-events:auto}
.overlay .line{height:2px;width:0;background:var(--model);margin:40px 0 0}
.overlay .head .m{background-size:0% 5px;background-position:0 94%}
.overlay .opener{font:400 66px/1.3 var(--sans);color:#e8e1d4;max-width:1500px;letter-spacing:-.5px}
.overlay .opener .c{opacity:0}
.overlay .opener-who{font:600 20px var(--mono);color:var(--you);letter-spacing:4px;text-transform:uppercase;margin-bottom:30px}
.caret{display:inline-block;width:.5em;height:1em;background:var(--you);vertical-align:-.12em;margin-left:4px}

.hud{position:absolute;right:20px;top:16px;font:13px var(--mono);color:var(--faint);background:#000a;padding:8px 12px;border-radius:6px;transition:opacity .4s;z-index:10}
.hud.off{opacity:0}
.tc{position:absolute;left:20px;top:16px;font:13px var(--mono);color:var(--gold);background:#000a;padding:8px 12px;border-radius:6px;z-index:10;opacity:0;transition:opacity .3s}
.tc.on,.paused .tc{opacity:1}

/* chapter picker: display:none until `c`, so it never reaches a recording */
.picker{position:absolute;inset:0;z-index:20;display:none;flex-direction:column;padding:64px 96px 56px;background:#0b0d10f2;backdrop-filter:blur(6px)}
.picker.open{display:flex}
.pk-head{display:flex;align-items:baseline;gap:28px;padding-bottom:22px;border-bottom:1px solid var(--rule);margin-bottom:26px}
.pk-title{font:400 40px/1.1 var(--serif);letter-spacing:-.5px;color:var(--paper)}
.pk-filter{font:20px var(--mono);color:var(--gold);min-width:120px}
.pk-keys{margin-left:auto;font:14px var(--mono);color:var(--faint);letter-spacing:1px}
.pk-grid{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:26px;align-content:start;padding:4px;scrollbar-width:none}
.pk-grid::-webkit-scrollbar{display:none}
.pk-card{background:var(--panel);border:1px solid var(--rule);border-radius:12px;overflow:hidden;cursor:pointer}
.pk-card.on{border-color:var(--model);box-shadow:0 0 0 2px #9fe0b455,0 20px 60px #0008}
.pk-thumb{position:relative;aspect-ratio:16/9;overflow:hidden;background:var(--bg)}
.pk-text{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:0 24px;text-align:center;font:400 22px/1.25 var(--serif);color:var(--faint)}
.pk-frame{position:absolute;left:0;top:0;width:1920px;height:1080px;border:0;transform-origin:0 0;opacity:0;transition:opacity .3s;pointer-events:none}
.pk-frame.ready{opacity:1}
.pk-meta{display:flex;align-items:baseline;gap:12px;padding:12px 16px 14px;border-top:1px solid var(--rule)}
.pk-meta b{font:500 16px var(--mono);color:var(--model);letter-spacing:1px}
.pk-name{flex:1;min-width:0;font:400 19px/1.25 var(--serif);color:var(--paper);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pk-time{font:13px var(--mono);color:var(--faint);white-space:nowrap}
.still .hud,.still .tc{display:none}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="top" id="top"><div class="ch"><span class="num" id="tnum"></span><span class="title" id="ttitle"></span></div><span class="src" id="tsrc"></span></div>
  <div class="rule" id="trule"></div>
  <div class="content" id="content"></div>
  <div class="progress" id="progress"></div>
  <div class="brand" id="brand"></div>
  <div class="overlay" id="overlay"></div>
  <div class="hud" id="hud">space pause · ← → step · shift ← → chapter · , . 1s · &lt; &gt; 5s · home chapter start · r restart · c chapters · h hide</div>
  <div class="tc" id="tc"></div>
  <div class="picker" id="picker"></div>
</div>
<script>
// ── config ────────────────────────────────────────────────────────────────
// Everything the viewer reads lives in SHOW_CONFIG, CHAPTERS and CLIPS.
// Quotes are verbatim from the repos (paths in each chapter's source line);
// "…" marks a cut. Panels labelled "illustration" are invented to contrast.
const SHOW_CONFIG = {
  modelLabel: "the o family",
  youLabel: "the question",
  brand: "o family · declarative",
  intro: {
    kicker: "{{icon:family}} o family · Go tools on oden and ochazuke",
    head: "Declare it as [[data]], and the machinery can [[read it, check it, generate from it and mount it.]]",
    sub: "nouns · verbs · bindings · catalogs · stories   —   real code, real recordings",
  },
  opener: null,
  // the first and last slides: the family mark, then each member with a mark
  // of its own (libraries, the host, then the tools)
  front: { name: "o family", mark: "{{icon:family}} o family",
    items: ["{{icon:ochazuke}} ochazuke", "{{icon:oden}} oden", "{{icon:matomeru}} matomeru", "{{icon:o-ai}} o-ai", "{{icon:o-inventory}} o-inventory", "{{icon:o-proj}} o-proj"] },
  back: { name: "o family (end)", mark: "{{icon:family}} o family",
    items: ["{{icon:ochazuke}} ochazuke", "{{icon:oden}} oden", "{{icon:matomeru}} matomeru", "{{icon:o-ai}} o-ai", "{{icon:o-inventory}} o-inventory", "{{icon:o-proj}} o-proj"],
    foot: "github.com/unixsuperhero/o-family", href: "https://github.com/unixsuperhero/o-family" },
  outro: {
    kicker: "{{icon:family}} o family · the point",
    head: "Declared once as data, [[every app gets it for free.]] [[Done imperatively, every app writes it again.]]",
    sub: "{{icon:oden}} oden · {{icon:ochazuke}} ochazuke · {{icon:matomeru}} matomeru · {{icon:o-md}} o-md · {{icon:o-git}} o-git · {{icon:o-json}} o-json · {{icon:o-story}} o-story",
  },
};
const params = new URLSearchParams(location.search);
const SPEED = parseFloat(params.get("speed") || "1");

// CLIPS:BEGIN (tools/build.sh writes this)
const CLIPS = {
 "1-mtm-extensions": {

// ── helpers ───────────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
// Icons: text anywhere may hold {{icon:NAME}}; after a segment is built every
// one becomes the inline SVG ICONS[NAME]. An animation fills ICONS in its own
// beats section (from its build), including ICONS.family, the mark a name
// with none of its own falls back to; {{icon:-}} is an alias of family. With
// no family mark either, a neutral tile. Only text nodes are touched.
const ICONS = {};
const ICON_RE = /\{\{icon:([\w-]+)\}\}/g;
function iconize(root) {
  const walk = document.createTreeWalker(root, NodeFilter.SHOW_TEXT), hits = [];
  while (walk.nextNode()) if (walk.currentNode.nodeValue.includes("{{icon:")) hits.push(walk.currentNode);
  for (const n of hits) {
    const t = n.nodeValue, frag = document.createDocumentFragment(); let i = 0, m;
    ICON_RE.lastIndex = 0;
    while ((m = ICON_RE.exec(t))) {
      frag.append(t.slice(i, m.index));
      const svg = ICONS[m[1] === "-" ? "family" : m[1]] || ICONS.family, s = el("span", "ico" + (svg ? "" : " none"));
      if (svg) s.innerHTML = svg;
      frag.append(s); i = ICON_RE.lastIndex;
    }
    frag.append(t.slice(i)); n.replaceWith(frag);
  }
}
const EASE = "cubic-bezier(.2,.7,.2,1)";
const anims = [];
// Things that are not Web Animations (a <video>) register a sync(clock,
// playing) here; seek and every tick call it with the segment clock.
const syncs = [];
let marks = [];   // seek points in the current segment (ms)
const mark = t => marks.push(t);
let seen = new WeakSet();
// Every animation is created up front with a delay and held paused; the
// player sets their time from its own clock, so seeking is exact. Only the
// first one on a node fills backwards; later ones fill forwards, so they
// cannot override the earlier ones before they start.
function A(node, frames, delay, duration, easing = EASE) {
  const fill = seen.has(node) ? "forwards" : "both";
  seen.add(node);
  const a = node.animate(frames, { delay, duration, easing, fill });
  a.pause();
  a.currentTime = 0;
  anims.push(a);
  return a;
}
const fadeIn = (n, t, d = 500) => A(n, [{ opacity: 0 }, { opacity: 1 }], t, d, "ease-out");
const fadeUp = (n, t, d = 600, dy = 18) => A(n, [{ opacity: 0, transform: `translateY(${dy}px)` }, { opacity: 1, transform: "none" }], t, d);
const fadeOut = (n, t, d = 500) => A(n, [{ opacity: 1 }, { opacity: 0 }], t, d, "ease-in");
const underline = (m, t, d, px = 3, from = null, to = null) => {
  const f0 = { backgroundSize: `0% ${px}px` }, f1 = { backgroundSize: `100% ${px}px` };
  if (from) { f0.color = from; f1.color = to; }
  return A(m, [f0, f1], t, d, "ease-in-out");
};

function segments(text) {
  const out = []; const re = /\[\[([\s\S]*?)\]\]/g; let i = 0, m;
  while ((m = re.exec(text))) { if (m.index > i) out.push([text.slice(i, m.index), false]); out.push([m[1], true]); i = re.lastIndex; }
  if (i < text.length) out.push([text.slice(i), false]);
  return out;
}

const TOK = /(\/\/.*$)|("(?:[^"\\]|\\.)*"|`[^`]*`)|(\b(?:return|if|else|for|of|const|let|func)\b)|([A-Za-z_][\w.]*(?=\())|([A-Za-z_]\w*(?=\s*:(?![:=])))|(→|=>|\?\?|===|==|:=|\.\.\.)|(\b\d+\b)/g;
const CLS = [null, "com", "str", "kw", "fn", "key", "op", "num"];
function highlight(line, lang) {
  if (lang === "md") return esc(line).replace(/^(\s*)(- \[ \]|-)/, '$1<span class="op">$2</span>');
  let out = "", i = 0, m;
  TOK.lastIndex = 0;
  while ((m = TOK.exec(line))) {
    out += esc(line.slice(i, m.index));
    const g = m.slice(1).findIndex(x => x !== undefined) + 1;
    out += `<span class="${CLS[g]}">${esc(m[0])}</span>`;
    i = TOK.lastIndex;
    if (m[0].length === 0) TOK.lastIndex++;
  }
  return out + esc(line.slice(i));
}
// wraps regex matches in text nodes with span.glow
function wrapGlow(root, sources) {
  if (!sources || !sources.length) return [];
  const found = [];
  const walk = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const nodes = []; while (walk.nextNode()) nodes.push(walk.currentNode);
  const re = new RegExp(sources.join("|"), "g");
  for (const n of nodes) {
    const t = n.nodeValue; re.lastIndex = 0; if (!re.test(t)) continue; re.lastIndex = 0;
    const frag = document.createDocumentFragment(); let i = 0, m;
    while ((m = re.exec(t))) {
      frag.append(t.slice(i, m.index));
      const s = el("span", "glow"); s.textContent = m[0]; frag.append(s); found.push(s);
      i = re.lastIndex;
    }
    frag.append(t.slice(i)); n.replaceWith(frag);
  }
  return found;
}
const pulse = (g, t) => A(g, [
  { background: "#f0c67400", boxShadow: "0 0 0 0 #f0c67400" },
  { background: "#f0c67455", boxShadow: "0 0 0 4px #f0c67455", offset: .4 },
  { background: "#f0c67426", boxShadow: "0 0 0 2px #f0c67426" },
], t, 900);
// largest font size in [min,max] at which node fits inside box
function fit(node, box, min, max) {
  let lo = min, hi = max;
  while (hi - lo > 0.5) {
    const mid = (lo + hi) / 2; node.style.fontSize = mid + "px";
    (box.scrollHeight <= box.clientHeight + 1 && box.scrollWidth <= box.clientWidth + 1) ? lo = mid : hi = mid;
  }
  node.style.fontSize = lo + "px";
  return lo;
}
// shrink node's font until node is at most maxH tall
function fitHeight(node, maxH, start, min) {
  let s = start; node.style.fontSize = s + "px";
  while (node.offsetHeight > maxH && s > min) { s -= 1; node.style.fontSize = s + "px"; }
}

// text with marks: words become spans (you: characters), marks become .m
function renderText(host, text, perChar) {
  const units = [], marks = [];
  const paras = Array.isArray(text) ? text : [text];
  for (const para of paras) {
    const p = el("p");
    for (const [chunk, marked] of segments(para)) {
      const holder = marked ? el("span", "m") : p;
      if (marked) { marks.push(holder); p.append(holder); }
      chunk.split(/(`[^`]*`)/).forEach(part => {
        if (!part) return;
        let target = holder;
        if (part.startsWith("`")) { target = el("span", "code-inline"); holder.append(target); part = part.slice(1, -1); }
        if (perChar) {
          for (const c of part) {
            if (c === "\n") { target.append(el("br")); continue; }
            const s = el("span", "c"); s.textContent = c; target.append(s); units.push(s);
          }
        } else {
          for (const tok of part.split(/(\s+)/)) {
            if (!tok) continue;
            if (/^\s+$/.test(tok)) { target.append(" "); continue; }
            const w = el("span", "w"); w.textContent = tok; target.append(w); units.push(w);
          }
        }
      });
    }
    host.append(p);
  }
  return { units, marks };
}

// ── code panel ────────────────────────────────────────────────────────────
function buildCode(host, spec) {
  const panel = el("div", "panel");
  panel.innerHTML = `<div class="bar"><div class="dots"><i></i><i></i><i></i></div><div class="label"></div></div>`;
  const label = panel.querySelector(".label");
  const body = el("div", "body");
  const stack = el("div", "stack");
  body.append(stack); panel.append(body); host.append(panel);

  const groups = {};
  const blocks = spec.blocks.map(b => {
    const block = el("div", "block");
    const lines = b.lines.map((raw, i) => {
      const [, strike, indent, group, rest] = raw.match(/^(~)?(\s*)(?:@(\d)\|)?([\s\S]*)$/);
      const text = indent + rest;  // "  @1|x" and "@1|  x" both keep their indentation
      const ln = el("span", "ln", highlight(text, spec.lang) || " ");
      ln.dataset.n = i + 1;
      if (strike) ln.append(el("span", "strike"));
      if (group) (groups[group] ||= []).push(ln);
      block.append(ln);
      return { ln, struck: !!strike };
    });
    const glows = wrapGlow(block, spec.glow);
    stack.append(block);
    const lab = el("span", null, esc(b.label)); label.append(lab);
    return { block, lines, glows, lab };
  });
  const multi = blocks.length > 1;

  return {
    root: panel, groups, lineCount: blocks.reduce((n, b) => n + b.lines.length, 0),
    fit() { fit(stack, body, 11, spec.big ? 30 : 22); },
    play(t) {
      A(panel, [{ opacity: 0, transform: "translateX(40px)" }, { opacity: 1, transform: "none" }], t, 700);
      t += 300;
      blocks.forEach((b, bi) => {
        const last = bi === blocks.length - 1;
        fadeIn(b.lab, t, 400);
        if (multi) A(b.block, [{ opacity: 1 }, { opacity: 1 }], t, 1);
        const step = Math.min(110, 1600 / b.lines.length);
        b.lines.forEach(({ ln }, i) => A(ln, [{ opacity: 0, transform: "translateX(-10px)" }, { opacity: 1, transform: "none" }], t + i * step, 420));
        t += b.lines.length * step + 500;
        b.glows.forEach((g, i) => pulse(g, t + i * 380));
        if (b.glows.length) t += b.glows.length * 380 + 700;
        if (!last) {
          t += 1400;
          const struck = b.lines.filter(l => l.struck);
          struck.forEach((l, i) => {
            A(l.ln.querySelector(".strike"), [{ transform: "scaleX(0)" }, { transform: "scaleX(1)" }], t + i * 160, 450);
            A(l.ln, [{ opacity: 1 }, { opacity: .35 }], t + i * 160 + 250, 400);
          });
          t += struck.length * 160 + 1300;
          fadeOut(b.block, t, 500);
          fadeOut(b.lab, t, 400);
          t += 550;
        }
      });
      return t;
    },
  };
}

function buildCards(host, groupsSpec) {
  const wrap = el("div", "cards");
  wrap.style.opacity = 0;
  const parts = groupsSpec.map(g => {
    const card = el("div", `card ${g.cls}`);
    const h = el("h4", null, esc(g.title)); card.append(h);
    const items = g.items.map(txt => {
      const hot = txt.startsWith("!");
      const it = el("div", "item" + (hot ? " hot" : ""), esc(hot ? txt.slice(1) : txt));
      card.append(it); return it;
    });
    wrap.append(card);
    return { h, items };
  });
  host.append(wrap);
  return {
    root: wrap, groups: {}, lineCount: 7,
    fit() {},
    play(t) {
      fadeIn(wrap, t, 300);
      for (const p of parts) {
        fadeUp(p.h, t, 500, 8); t += 300;
        p.items.forEach(it => { A(it, [{ opacity: 0, transform: "translateX(30px)" }, { opacity: 1, transform: "none" }], t, 550); t += 420; });
        t += 500;
      }
      return t + 600;
    },
  };
}

// lights up glow group k across panels: each line warms, then settles
function glowGroup(lines, t) {
  lines.forEach(ln => A(ln, [
    { backgroundColor: "#f0c67400" },
    { backgroundColor: "#f0c67440", offset: .3 },
    { backgroundColor: "#f0c6741c" },
  ], t, 1400, "ease-out"));
}

// ── beats: each takes (layer host, t) and returns the end time ───────────
function beatThread(host, beat, t0) {
  const layer = el("div", "layer thread-layer");
  host.append(layer);
  const viewport = el("div", "viewport");
  const thread = el("div", "thread");
  viewport.append(thread);
  const right = el("div", "right");
  layer.append(viewport, right);
  const slots = [];
  const slotOf = i => { while (slots.length <= i) { const s = el("div", "slot"); right.append(s); slots.push(s); } return slots[i]; };
  if (beat.messages.some(m => m.code?.slot === 1)) { slotOf(1); right.classList.add("two"); }

  // build everything hidden, then measure
  const items = beat.messages.map(msg => {
    const node = el("div", `msg ${msg.who}`);
    node.append(el("div", "who", msg.who === "you" ? `❯ ${esc(SHOW_CONFIG.youLabel)}` : `⏺ ${esc(SHOW_CONFIG.modelLabel)}`));
    const text = el("div", "text");
    node.append(text);
    thread.append(node);
    const { units, marks } = renderText(text, msg.text, msg.who === "you");
    let panel = null, slot = 0;
    if (msg.code) { slot = msg.code.slot || 0; panel = buildCode(slotOf(slot), msg.code); }

  });
  const vh = viewport.clientHeight;
  items.forEach(it => fitHeight(it.text, vh - 90, it.msg.who === "you" ? 27 : 32, 18));
  items.forEach(it => it.panel?.fit());

  let t = t0;
  mark(t);
  fadeIn(layer, t, 400);
  t += 200;
  let scroll = 0;
  const current = [];   // panel currently shown in each slot
  const shown = [];

  for (const it of items) {
    mark(t);
    // scroll so the whole message is in view, and quiet the ones above
    const bottom = it.node.offsetTop + it.node.offsetHeight;
    const target = Math.max(0, bottom - vh + 8);
    if (target !== scroll) {
      A(thread, [{ transform: `translateY(${-scroll}px)` }, { transform: `translateY(${-target}px)` }], t, 800);
      scroll = target;
      t += 450;
    }
    shown.forEach(s => A(s, [{ opacity: 1 }, { opacity: .42 }], t, 600, "ease-out"));
    fadeUp(it.node, t, 500, 10);
    shown.push(it.node);
    t += 400;
    const start = t;

    if (it.msg.who === "you") {
      const per = Math.min(26, 3600 / Math.max(it.units.length, 1));
      it.units.forEach((c, i) => A(c, [{ opacity: 0 }, { opacity: 1 }], t + i * per, 60, "linear"));
      t += it.units.length * per + 300;
      for (const m of it.marks) {

        underline(m, t, d, 3, "#d6d0c4", "#fff3e6");
        t += d + 150;
      }
    } else {
      const per = Math.min(50, 3200 / Math.max(it.units.length, 1));
      it.units.forEach((w, i) => A(w, [{ opacity: 0, transform: "translateY(6px)" }, { opacity: 1, transform: "none" }], t + i * per, 380));
      t += it.units.length * per + 300;
    }

    if (it.panel) {
      mark(t);
      const prev = current[it.slot];
      if (prev) A(prev.root, [{ opacity: 1, transform: "none" }, { opacity: 0, transform: "translateX(-30px)" }], t, 450, "ease-in");
      current[it.slot] = it.panel;
      t = it.panel.play(t + (prev ? 250 : 0)) + 300;
      if (it.msg.code?.glowAfter) { glowGroup(it.panel.groups[1] || [], t); t += 1600; }
    }

    if (it.msg.who === "model") {
      if (it.marks.length) mark(t);
      for (const m of it.marks) {
        const d = Math.max(600, Math.min(2200, m.textContent.length * 14));
        underline(m, t, d, 3, "#bdb7ab", "#f6f1e7");
        t += d + 250;
      }
      if (it.msg.links) {
        t += 300;
        for (let k = 1; k <= 9; k++) {
          const lines = current.flatMap(p => (p && p.groups[k]) || []);
          if (!lines.length) continue;
          glowGroup(lines, t);
          t += 1700;
        }

      const words = it.units.length, code = it.panel ? it.panel.lineCount : 0;
      t = Math.max(t + 1800, start + words * 285 + code * 90 + 1200);
    } else {
      t += it.panel ? 1800 : 1100;
    }
  }
  t += 800;
  fadeOut(layer, t, 600);
  return t + 600;
}

function beatSplit(host, beat, t0) {

function beatFan(host, beat, t0) {
  const R = beat;

  area.append(card);
  const readerEls = R.targets.map((tg, i) => {
    const r = el("div", "reader");
    r.style.top = (i * Math.min(126, (610 - 104) / Math.max(1, R.targets.length - 1))) + "px";
    // <faint>…</faint> and <chip>…</chip> are styled spans; everything else is highlighted code
    const body = tg.lines.map(l => l.split(/(<(?:faint|chip)>[\s\S]*?<\/(?:faint|chip)>)/).map(part => {
      const m = part.match(/^<(faint|chip)>([\s\S]*)<\/\1>$/);

    }).join("")).join("\n");

    area.append(r);

  });

  card.style.top = ((610 - card.offsetHeight) / 2) + "px";
  const cardGlows = wrapGlow(code, R.glow);
  const readerGlows = readerEls.map(r => wrapGlow(r.querySelector(".rbody"), R.glow));

  // curves from the card to each reader, and a dot riding each one
  const x0 = card.offsetLeft + card.offsetWidth, y0 = card.offsetTop + card.offsetHeight / 2;
  const routes = readerEls.map(r => {
    const x1 = r.offsetLeft - 4, y1 = r.offsetTop + r.offsetHeight / 2, mx = (x0 + x1) / 2;
    const d = `M${x0 + 4},${y0} C${mx},${y0} ${mx},${y1} ${x1},${y1}`;
    const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
    p.setAttribute("d", d); p.setAttribute("pathLength", "1"); svg.append(p);

    return { p, dot };
  });

  let t = t0;
  mark(t);
  fadeIn(layer, t, 300);
  A(card, [{ opacity: 0, transform: "scale(.95)" }, { opacity: 1, transform: "none" }], t + 200, 800);
  t += 1300;
  cardGlows.forEach((g, i) => pulse(g, t + i * 200));
  t += cardGlows.length * 200 + 900;
  routes.forEach(({ p, dot }, i) => {
    const s = t + i * 650;
    A(p, [{ strokeDashoffset: 1 }, { strokeDashoffset: 0 }], s, 900, "ease-in-out");
    A(dot, [{ offsetDistance: "0%", opacity: 0 }, { offsetDistance: "10%", opacity: 1, offset: .1 }, { offsetDistance: "100%", opacity: 1 }], s, 900, "ease-in-out");
    A(dot, [{ opacity: 1 }, { opacity: 0 }], s + 950, 300);
    A(readerEls[i], [{ opacity: 0, transform: "translateX(18px)" }, { opacity: 1, transform: "none" }], s + 750, 500);
    readerGlows[i].forEach(g => pulse(g, s + 1100));
  });
  t += routes.length * 650 + 1800;

  mark(t);
  const per = Math.min(50, 3000 / units.length);
  units.forEach((w, i) => A(w, [{ opacity: 0, transform: "translateY(6px)" }, { opacity: 1, transform: "none" }], t + i * per, 380));
  t += units.length * per + 300;
  for (const m of capMarks) { underline(m, t, 2400, 3, "#bdb7ab", "#f6f1e7"); t += 2600; }
  t = Math.max(t + 2500, t0 + units.length * 300 + 9000);
  fadeOut(layer, t, 600);
  return t + 600;
}

// ── this animation's own beats: Object.assign(BEATS, { name: builder }) ──
// A clip is a real recording. The video is not a Web Animation, so it gets a
// sync function instead: every seek and every tick sets its time from the
// same segment clock (play at SPEED while the clock runs and it is in range;
// a seek, a pause or drift over 250ms sets currentTime exactly).
function beatClip(host, spec, t0) {

  // fast it is) and sped-up ones (rate > 1, with the factor); otherwise the
  // slot stays, empty, so every frame sits at the same place
  const sped = (beat.rate || 1) > 1;

  const tag = el("div", "clip-tag" + (sped ? " fast" : "") + (tagText ? "" : " empty"), `<i></i>${esc(tagText || "·")}`);
  // the label sits above the frame, never on the recording
  const left = el("div", "clip-left");

  const cap = el("div", "clip-cap", esc(beat.caption || ""));
  left.append(cap);
  const side = el("div", "clip-side");
  const kick = el("div", "kick", esc(beat.kicker || "")); side.append(kick);
  const head = el("div", "head", markup(beat.head || "")); side.append(head);
  const cues = (beat.cues || []).map(c => {
    const n = el("div", "cue", `<b>${esc(c.keys)}</b> ${esc(c.text)}`); side.append(n); return { n, at: c.at };
  });
  let free = null;
  if (beat.free) {
    free = el("div", "free", `<div class="h">${esc(beat.free.title)}</div>` + beat.free.items.map(i => `<div class="it">${markup(i)}</div>`).join(""));
    side.append(free);
  }

  const inner = el("div", "clip-inner");

  side.append(inner);
  layer.append(left, side);
  host.append(layer);

  const sideH = host.clientHeight;
  let t = t0;
  mark(t);
  fadeIn(layer, t, 300);
  A(box, [{ opacity: 0, transform: "scale(.97)" }, { opacity: 1, transform: "none" }], t + 100, 700);
  fadeUp(kick, t + 300, 500, 8);
  fadeUp(head, t + 450, 700, 12);
  fadeIn(cap, t + 700, 500);
  const vStart = t + 1100, dur = beat.dur, rate = beat.rate || 1;
  const from = (beat.from || 0) / 1000;
  syncs.push((clock, playing) => {
    const local = (clock - vStart) / 1000 * rate;
    const want = Math.max(0, Math.min(dur / 1000, local)) + from;
    const inside = local > 0 && local < dur / 1000;
    if (!v.readyState) return;
    if (playing && inside) {
      v.playbackRate = SPEED * rate;
      if (v.paused) { v.currentTime = want; v.play().catch(() => {}); }
      else if (Math.abs(v.currentTime - want) > 0.25) v.currentTime = want;
    } else {
      if (!v.paused) v.pause();
      if (Math.abs(v.currentTime - want) > 0.02) v.currentTime = want;
    }
  });
  let shownTop = 0;
  cues.forEach((c, i) => {
    const at = vStart + c.at / rate;
    mark(at);
    A(c.n, [{ opacity: 0, transform: "translateX(16px)" }, { opacity: 1, transform: "none" }], at, 400);
    A(c.n, [{ borderLeftColor: "#9fe0b4" }, { borderLeftColor: "#9fe0b4" }], at, 1);
    const next = cues[i + 1];
    if (next) A(c.n, [{ opacity: 1 }, { opacity: .45 }], vStart + next.at / rate, 500, "ease-out");
  });
  // scroll the side column up when the cues would run off the bottom
  const bottomOf = n => n.offsetTop + n.offsetHeight;
  cues.forEach(c => {
    const over = bottomOf(c.n) - sideH + 10;
    if (over > shownTop) {
      const at = vStart + c.at / rate - 300;
      A(inner, [{ transform: `translateY(${-shownTop}px)` }, { transform: `translateY(${-over}px)` }], at, 500);
      shownTop = over;
    }
  });
  t = vStart + dur / rate;
  if (free) { mark(t - 2500); fadeUp(free, t - 2500, 600, 12); if (bottomOf(free) - sideH + 10 > shownTop) { A(inner, [{ transform: `translateY(${-shownTop}px)` }, { transform: `translateY(${-(bottomOf(free) - sideH + 10)}px)` }], t - 2800, 500); } }
  t += beat.hold ?? 2200;
  fadeOut(layer, t, 600);
  return t + 600;
}

// a grid of small cards: one per app, each listing the same keys
function beatKeys(host, beat, t0) {

// contrast: the left panel is one function cut into bands; each band sits
// in a grid row with its counterpart on the right, so code is level with
// code and config with config. Then the glow groups light both sides.
function ctLines(lines, lang) {
  const block = el("div", "block ct-code");
  const groups = {}; const all = [];
  lines.forEach(raw => {
    const [, , indent, group, rest] = raw.match(/^(~)?(\s*)(?:@(\d)\|)?([\s\S]*)$/);
    const ln = el("span", "ln", highlight(indent + rest, lang) || " ");
    if (group) (groups[group] ||= []).push(ln);
    block.append(ln); all.push(ln);
  });
  return { block, groups, all };
}
function beatContrast(host, beat, t0) {
  const C = beat.spec;
  const layer = el("div", "layer ct-layer");
  const bar = el("div", "ct-bar", `<div>${esc(C.left.label)}</div><span></span><div>declared</div>`);
  layer.append(bar);
  const groups = {};
  const addGroups = g => { for (const k in g) (groups[k] ||= []).push(...g[k]); };
  const rows = C.left.bands.map((band, i) => {
    const l = el("div", `ct-l ${band.kind}` + (i === 0 ? " first" : "") + (i === C.left.bands.length - 1 ? " last" : ""));
    const L = ctLines(band.lines, band.lang); l.append(L.block); addGroups(L.groups);
    const rb = C.right.bands[i];
    const mid = el("div", `ct-mid ${band.kind}`, `<span>${band.kind === "config" ? "config" : "code"}</span>`);
    const r = el("div", `ct-r ${rb.kind}`);
    const panel = el("div", "panel");
    panel.innerHTML = `<div class="bar"><div class="dots"><i></i><i></i><i></i></div><span>${esc(rb.label)}</span></div>`;
    const body = el("div", "body"); const R = ctLines(rb.lines, rb.lang); body.append(R.block); panel.append(body); r.append(panel); addGroups(R.groups);
    layer.append(l, mid, r);
    return { l, L, mid, panel, R };
  });
  const cap = el("div", "ct-cap");
  const caps = Object.entries(C.groups || {}).map(([k, text]) => { const d = el("div", null, esc(text)); cap.append(d); return [k, d]; });
  layer.append(cap);
  host.append(layer);
  // one type size for both sides: the largest that fits the content area
  const blocks = [...layer.querySelectorAll(".ct-code")];
  let size = 19;
  const setSize = z => blocks.forEach(b => { b.style.fontSize = z + "px"; b.style.lineHeight = "1.42"; });
  setSize(size);
  while ((layer.scrollHeight > host.clientHeight || layer.scrollWidth > host.clientWidth + 1 || blocks.some(b => b.scrollWidth > b.clientWidth + 1)) && size > 11) setSize(size -= 0.5);
  let t = t0;
  mark(t);
  fadeIn(layer, t, 300);
  [...bar.children].forEach((d, i) => fadeIn(d, t + 100 + i * 200, 500));
  t += 600;
  rows.forEach(row => {
    mark(t);
    fadeIn(row.l, t, 400);
    const step = Math.min(70, 1200 / row.L.all.length);
    row.L.all.forEach((ln, i) => A(ln, [{ opacity: 0, transform: "translateX(-8px)" }, { opacity: 1, transform: "none" }], t + 150 + i * step, 380));
    t += 150 + row.L.all.length * step + 300;
    A(row.mid, [{ opacity: 0 }, { opacity: 1 }], t, 400, "ease-out");
    A(row.panel, [{ opacity: 0, transform: "translateX(30px)" }, { opacity: 1, transform: "none" }], t + 150, 600);
    row.R.all.forEach((ln, i) => A(ln, [{ opacity: 0 }, { opacity: 1 }], t + 400 + i * 90, 380, "ease-out"));
    t += 400 + row.R.all.length * 90 + 900;
  });

  // each correspondence in turn: the lines on both sides, and what they mean
  for (const [k, d] of caps) {
    const lines = groups[k] || [];
    if (!lines.length) continue;
    mark(t);
    glowGroup(lines, t);
    A(d, [{ opacity: 0, transform: "translateY(6px)" }, { opacity: 1, transform: "none" }, { opacity: 1, offset: .85 }, { opacity: 0 }], t, 2600);
    t += 2700;
  }
  t += 2200;
  fadeOut(layer, t, 600);
  return t + 600;
}

  function onKey(e) {
    const k = e.key;
    if (!open) { if ((k === "c" || k === "C") && !e.metaKey && !e.ctrlKey) { show(); e.preventDefault(); return true; } return false; }
    e.preventDefault();
    if (typing) {
      if (k === "Escape") { typing = false; filter = ""; }
      else if (k === "Enter") { typing = false; }
      else if (k === "Backspace") filter = filter.slice(0, -1);
      else if (k.length === 1) filter += k;
      render(); return true;
    }
    if (k === "Escape" || k === "c" || k === "C") hide();
    else if (k === "j" || k === "ArrowDown" || k === "ArrowRight") move(1);
    else if (k === "k" || k === "ArrowUp" || k === "ArrowLeft") move(-1);
    else if (k === "Enter") jump(sel);
    else if (k === "/") { typing = true; render(); }
    else if (/^\d$/.test(k)) {
      digits += k; clearTimeout(digitTimer);
      const most = SHOW.filter(s => s.kind === "chapter").length;
      if (parseInt(digits + "0", 10) > most) digitJump(); else { render(); digitTimer = setTimeout(digitJump, 600); }
    }
    return true;
  }
  return { onKey, show, hide, get open() { return open; } };
})();

addEventListener("keydown", e => {
  if (picker.onKey(e)) return;
  const k = e.key;
  if (k === " ") { e.preventDefault(); setPaused(!paused); }
  else if (k === "ArrowRight") e.shiftKey ? go(cur + 1) : step(1);
  else if (k === "ArrowLeft") e.shiftKey ? go(clock > 1500 ? cur : cur - 1) : step(-1);
  else if (k === ".") seekBy(1000);
  else if (k === ",") seekBy(-1000);
  else if (k === ">") seekBy(5000);
  else if (k === "<") seekBy(-5000);
  else if (k === "Home") seek(0);
  else if (k === "End") seek(marks[marks.length - 1]);
  else if (k === "r" || k === "R") go(0);
  else if (k === "h" || k === "H") $("hud").classList.toggle("off");
  else return;
  e.preventDefault();
});

function scale() {
  const s = Math.min(innerWidth / 1920, innerHeight / 1080);
  $("stage").style.transform = `scale(${s})`;
}
addEventListener("resize", scale); scale();
setTimeout(() => $("hud").classList.add("off"), 3500);
if (STILL) $("stage").classList.add("still");

// for scripts/frames.mjs and other headless checks
window.player = { go, seek, setPaused, step, picker, get state() { return { segment: cur, clock, endAt, marks: [...marks], segments: SHOW.length }; } };

const start = parseInt(params.get("scene") || "0", 10);
// ?still=1&at=mid|MS: a preview frame (the picker's): segment, then hold
const startAt = params.get("at");
document.fonts.ready.then(() => {
  go(start);
  if (STILL) {
    setPaused(true);
    // the middle step point; a one-step segment (a title card), 75% in, once it has all appeared
    if (startAt === "mid") seek(marks.length > 1 ? Math.min(endAt, marks[Math.floor(marks.length / 2)] + 1200) : endAt * .75);
    else if (startAt) seek(parseFloat(startAt) || 0);
  }
  requestAnimationFrame(t => { last = t; tick(t); });
});
</script>
</body>
